<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AiFreeGens.com - Studio Win</title>
<style>
:root{--bg:#15171c;--panel:#1d2027;--line:#2b2f38;--text:#e7e9ee;--dim:#8a91a0;--accent:#4c8dff}
*{box-sizing:border-box}
body{margin:0;height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif;display:flex}
button,select{font:inherit;color:inherit}
button{background:var(--accent);border:0;border-radius:8px;padding:9px 18px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#home{margin:auto;text-align:center;max-width:460px}
#home h1{font-size:30px;margin:0 0 8px}
#home p{color:var(--dim);margin:0 0 28px}
#home button{font-size:16px;padding:13px 34px}
#home small{display:block;margin-top:16px;color:var(--dim)}
#editor{display:none;flex:1;min-width:0}
main{flex:1;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
canvas{width:100%;flex:1;min-height:0;object-fit:contain;background:#000;border-radius:10px}
.bar{display:flex;gap:12px;align-items:center}
.bar input[type=range]{flex:1}
aside{width:290px;background:var(--panel);border-left:1px solid var(--line);padding:14px 18px;overflow:hidden}
aside h2{font-size:13px;color:var(--dim);font-weight:500;margin:14px 0 6px}
aside h2:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:10px}
.row label{flex:1}
.row input[type=range]{width:120px}
.row output{width:56px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.presets button{flex:1;padding:8px 0}
select{color-scheme:dark;background:#2b2f38;color:#fff;border:1px solid #444a56;border-radius:8px;padding:9px 12px;font-size:14px}
option{background:#1d2027;color:#e7e9ee}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw i{width:38px;height:38px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:#fff}
#home select{margin-top:14px}
#hk{margin-top:8px;width:200px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px;font:inherit}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2b2f38;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-height:800px){aside{padding:10px 16px}aside h2{margin:8px 0 3px}.row{margin:3px 0}.sw i{width:32px;height:32px}button{padding:7px 14px}}
#status{color:var(--dim);font-size:13px;min-height:20px;margin-top:6px}
video{display:none}
</style>
</head>
<body>
<section id="home">
  <h1>录屏，然后让它好看</h1>
  <p>录制主屏幕，自动放大点击处、平滑光标，加上背景与圆角后导出。</p>
  <button id="rec">开始录制</button>
  <select id="cd" aria-label="倒计时"><option value="1">倒计时 1 秒</option><option value="2">倒计时 2 秒</option><option value="3">倒计时 3 秒</option></select>
  <small>点击后窗口隐藏并倒计时，结束后开始录制。结束录制的快捷键：</small>
  <input id="hk" readonly aria-label="结束录制快捷键，点击后按下新的组合键">
</section>

<section id="editor">
  <main>
    <canvas id="c" width="1920" height="1080"></canvas>
    <div class="bar">
      <button id="play" class="ghost">播放</button>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="时间轴">
      <span id="time">0:00</span>
    </div>
  </main>
  <aside>
    <div class="row presets"><button id="best" class="ghost">按本机自动推荐</button></div>
    <h2>背景</h2><div class="sw" id="sw"></div>
    <h2>画面</h2>
    <div class="row"><label for="ratio">画面比例</label><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option><option>4:5</option><option>21:9</option></select></div>
    <div class="row"><label for="pad">边距</label><input id="pad" type="range" min="0" max="200" value="80"></div>
    <div class="row"><label for="radius">圆角</label><input id="radius" type="range" min="0" max="60" value="24"></div>
    <div class="row"><label for="shadow">阴影</label><input id="shadow" type="range" min="0" max="120" value="60"></div>
    <h2>镜头</h2>
    <div class="row"><label for="win" title="切换到某个窗口操作时，镜头自动框住该窗口">窗口聚焦</label><input id="win" type="checkbox" checked></div>
    <div class="row"><label for="auto">点击时自动放大</label><input id="auto" type="checkbox" checked></div>
    <div class="row"><label for="zoom">放大倍数</label><input id="zoom" type="range" min="1.2" max="3" step="0.1" value="1.9"></div>
    <div class="row"><label for="smooth">镜头平滑</label><input id="smooth" type="range" min="1" max="10" step="1" value="5"></div>
    <div class="row"><label for="cursor">光标大小</label><input id="cursor" type="range" min="0.8" max="3" step="0.1" value="1.4"></div>
    <div class="row"><label for="sync">光标同步</label><input id="sync" type="range" min="-300" max="500" step="10" value="0"></div>
    <h2>导出</h2>
    <div class="row"><select id="fmt"><option value="mp4">MP4</option><option value="webm">WebM</option><option value="gif">GIF</option></select><button id="export">导出</button></div>
    <div id="status"></div>
    <div class="row"><button id="again" class="ghost">重新录制</button></div>
  </aside>
</section>
<div id="toast" role="status"></div>
<video id="video" playsinline></video>
<script src="renderer.js"></script>
</body>
</html>
